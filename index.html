<!doctype html>
<html lang="en" data-theme="dark" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>devfinder</title>

    <link rel="preconnect" href="https://googleapis.com" />
    <link rel="preconnect" href="https://gstatic.com" crossorigin />
    <link
      href="https://googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <h1 class="logo">devfinder</h1>
        <button id="theme-toggle" class="theme-btn" type="button">
          <span id="theme-text">LIGHT</span>
          <svg
            id="icon-sun"
            width="20"
            height="20"
            viewBox="0 0 20 20"
            fill="currentColor"
          >
            <path
              d="M10 15a5 5 0 100-10 5 5 0 000 10zm0-11a1 1 0 01-1-1V1a1 1 0 112 0v2a1 1 0 01-1 1zm0 16a1 1 0 01-1-1v-2a1 1 0 112 0v2a1 1 0 01-1 1zM3 11H1a1 1 0 110-2h2a1 1 0 110 2zm16 0h-2a1 1 0 110-2h2a1 1 0 110 2zM4.22 5.64a1 1 0 01-.7-.29L2.1 3.93a1 1 0 011.42-1.42l1.41 1.42a1 1 0 01-.71 1.71zm12.95 12.95a1 1 0 01-.7-.29l-1.42-1.42a1 1 0 011.42-1.41l1.41 1.41a1 1 0 01-.71 1.71zM2.81 18.59a1 1 0 01-.71-1.71l1.42-1.41a1 1 0 011.41 1.41l-1.41 1.42a1 1 0 01-.71.29zM15.76 5.64a1 1 0 01-.71-1.71l1.42-1.42a1 1 0 011.41 1.42l-1.41 1.42a1 1 0 01-.71.29z"
            />
          </svg>
          <svg
            id="icon-moon"
            style="display: none"
            width="20"
            height="20"
            viewBox="0 0 20 20"
            fill="currentColor"
          >
            <path
              d="M19.513 11.397a.701.701 0 00-.588.128 7.496 7.496 0 01-2.276 1.336 7.101 7.101 0 01-2.583.462 7.505 7.505 0 01-5.32-2.209 7.568 7.568 0 01-2.199-5.342c0-.873.154-1.72.41-2.49a6.904 6.904 0 011.227-2.21.657.657 0 00-.102-.924.701.701 0 00-.589-.128C5.32.61 3.427 1.92 2.072 3.666A10.158 10.158 0 000 9.83c0 2.8.918 5.37 2.753 7.413 1.835 2.043 4.185 3.16 7.05 3.35 2.865.19 5.455-.646 7.77-2.507a10.228 10.228 0 002.633-3.44.696.696 0 00-.163-.77.694.694 0 00-.53-.479z"
            />
          </svg>
        </button>
      </header>

      <form id="search-form" class="search-bar">
        <svg
          class="search-icon"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#0079FF"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input
          type="text"
          id="search-input"
          placeholder="Search GitHub username…"
          autocomplete="off"
        />
        <span id="error-msg" class="error-msg">No results</span>
        <button type="submit" class="search-btn">Search</button>
      </form>

      <section class="profile-card">
        <div class="avatar-circle"></div>

        <div class="profile-header">
          <div>
            <h2 id="name" class="name">The Octocat</h2>
            <a
              id="username"
              href="https://github.com"
              target="_blank"
              class="username"
              >@octocat</a
            >
          </div>
          <p id="joined-date" class="joined-date">Joined 25 Jan 2011</p>
        </div>

        <div class="profile-body">
          <p id="bio" class="bio">This profile has no bio</p>

          <div class="stats-box">
            <div class="stat-item">
              <span class="stat-label">Repos</span>
              <span id="repos" class="stat-value">8</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">Followers</span>
              <span id="followers" class="stat-value">3938</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">Following</span>
              <span id="following" class="stat-value">9</span>
            </div>
          </div>

          <div class="links-grid">
            <div class="link-item" id="location-box">
              <svg
                width="14"
                height="20"
                viewBox="0 0 14 20"
                fill="currentColor"
              >
                <path
                  d="M7 0C3.13 0 0 3.13 0 7c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 010-5 2.5 2.5 0 010 5z"
                />
              </svg>
              <span id="location">San Francisco</span>
            </div>

            <div class="link-item not-available" id="twitter-box">
              <svg
                width="20"
                height="17"
                viewBox="0 0 20 17"
                fill="currentColor"
              >
                <path
                  d="M20 1.924a8.192 8.192 0 01-2.357.646A4.11 4.11 0 0019.448.3a8.22 8.22 0 01-2.606.996A4.096 4.096 0 0013.847 0c-2.65 0-4.596 2.472-3.998 5.037A11.648 11.648 0 011.392.752a4.109 4.109 0 001.27 5.478 4.086 4.086 0 01-1.858-.513c-.045 1.9 1.318 3.679 3.291 4.075a4.113 4.113 0 01-1.853.07 4.106 4.106 0 003.833 2.849A8.25 8.25 0 010 14.41a11.616 11.616 0 006.29 1.843c7.618 0 11.923-6.434 11.663-12.205A8.354 8.354 0 0020 1.924z"
                />
              </svg>
              <a id="twitter" target="_blank">Not Available</a>
            </div>

            <div class="link-item" id="blog-box">
              <svg
                width="20"
                height="20"
                viewBox="0 0 20 20"
                fill="currentColor"
              >
                <path
                  d="M8.466 17.568l1.29-1.29a.562.562 0 000-.796l-.762-.763a.562.562 0 00-.795 0l-1.29 1.29a2.812 2.812 0 01-3.978-3.977l2.58-2.58a2.812 2.812 0 013.978 0 .562.562 0 00.795 0l.763-.762a.562.562 0 000-.796 5.063 5.063 0 00-7.159 0l-2.58 2.58a5.063 5.063 0 007.158 7.16zm10.225-16.26a5.063 5.063 0 00-7.159 0l-1.29 1.29a.562.562 0 000 .796l.763.763a.562.562 0 00.795 0l1.29-1.29a2.812 2.812 0 013.978 3.977l-2.58 2.58a2.812 2.812 0 01-3.978 0 .562.562 0 00-.795 0l-.763.762a.562.562 0 000 .796 5.063 5.063 0 007.16 0l2.58-2.58a5.063 5.063 0 000-7.16z"
                />
              </svg>
              <a id="blog" href="https://github.blog" target="_blank"
                >https://github.blog</a
              >
            </div>

            <div class="link-item" id="company-box">
              <svg
                width="20"
                height="20"
                viewBox="0 0 20 20"
                fill="currentColor"
              >
                <path
                  d="M18 8h-6V2a2 2 0 00-2-2H2a2 2 0 00-2 2v16a2 2 0 002 2h16a2 2 0 002-2v-8a2 2 0 00-2-2zM4 16H2v-2h2v2zm0-4H2v-2h2v2zm0-4H2V6h2v2zm0-4H2V2h2v2zm6 12H8v-2h2v2zm0-4H8v-2h2v2zm0-4H8V6h2v2zm0-4H8V2h2v2zm8 12h-6v-2h2v-2h-2v-2h2v-2h-2V8h6v8zm-2-6h-2v2h2v-2zm0 4h-2v2h2v-2z"
                />
              </svg>
              <span id="company">@github</span>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
